spring:
  main:
    allow-bean-definition-overriding: true
    keep-alive: true
  threads:
    virtual:
      enabled: true
  session:
    timeout: 30m
  h2:
    console:
      enabled: false
  application:
    name: spring-authorization-server-samples
  web:
    locale: en
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  messages:
    basename: i18n/messages
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp:
        auth: ${SPRING_MAIL_SMTP_AUTH:false}
        connectiontimeout: ${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:5000}
        timeout: ${SPRING_MAIL_SMTP_TIMEOUT:5000}
        writetimeout: ${SPRING_MAIL_SMTP_WRITE_TIMEOUT:5000}
        starttls:
          enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}
          required: ${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:false}
  profiles:
    active: '@spring.profiles.active@'
  docker:
    compose:
      lifecycle-management: start-only
      file: src/main/docker/services.yml
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.cache.region.factory_class: jcache
      hibernate.javax.cache.provider: com.github.benmanes.caffeine.jcache.spi.CaffeineCachingProvider
      hibernate.cache.use_second_level_cache: true
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: false
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.jdbc.fetch_size: 50
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.hibernate.SpringImplicitNamingStrategy
  data:
    web:
      pageable:
        max-page-size: 100
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: false

server:
  port: 9090
  shutdown: graceful

management:
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  security:
    mfa-verification-timeout: ${APP_MFA_VERIFICATION_TIMEOUT:PT5M}
    password-policy:
      minimum-length: ${APP_PASSWORD_MINIMUM_LENGTH:12}
      maximum-length: ${APP_PASSWORD_MAXIMUM_LENGTH:128}
      minimum-uppercase: ${APP_PASSWORD_MINIMUM_UPPERCASE:1}
      minimum-lowercase: ${APP_PASSWORD_MINIMUM_LOWERCASE:1}
      minimum-digits: ${APP_PASSWORD_MINIMUM_DIGITS:1}
      minimum-special-characters: ${APP_PASSWORD_MINIMUM_SPECIAL_CHARACTERS:1}
      reject-username: ${APP_PASSWORD_REJECT_USERNAME:true}
      reject-email: ${APP_PASSWORD_REJECT_EMAIL:true}
      reject-common-passwords: ${APP_PASSWORD_REJECT_COMMON_PASSWORDS:true}
      history-size: ${APP_PASSWORD_HISTORY_SIZE:5}
      expiration-days: ${APP_PASSWORD_EXPIRATION_DAYS:90}
      common-passwords: ${APP_PASSWORD_COMMON_PASSWORDS:password,123456,12345678,qwerty,qwerty123,admin,letmein}
    brute-force:
      enabled: ${APP_BRUTE_FORCE_ENABLED:true}
      max-failures: ${APP_BRUTE_FORCE_MAX_FAILURES:5}
      quick-login-window: ${APP_BRUTE_FORCE_QUICK_LOGIN_WINDOW:PT1S}
      minimum-quick-login-wait: ${APP_BRUTE_FORCE_MINIMUM_QUICK_LOGIN_WAIT:PT1M}
      wait-increment: ${APP_BRUTE_FORCE_WAIT_INCREMENT:PT1M}
      max-wait: ${APP_BRUTE_FORCE_MAX_WAIT:PT15M}
      failure-reset-time: ${APP_BRUTE_FORCE_FAILURE_RESET_TIME:PT12H}
      max-temporary-lockouts: ${APP_BRUTE_FORCE_MAX_TEMPORARY_LOCKOUTS:3}
      permanent-lockout: ${APP_BRUTE_FORCE_PERMANENT_LOCKOUT:false}
      ip-requests-per-minute: ${APP_LOGIN_IP_REQUESTS_PER_MINUTE:30}
      username-ip-requests-per-minute: ${APP_LOGIN_USERNAME_IP_REQUESTS_PER_MINUTE:5}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:Spring Authorization Server <no-reply@localhost>}
    base-url: ${APP_MAIL_BASE_URL:http://127.0.0.1:9090}
  session:
    cleanup-cron: "0 * * * * *"
  authorization-server:
    issuer: https://spring-authorization-server-samples.local
